project:
  type: default
  pre-render: python build_bib.py
  post-render: python fix_docx.py
  render:
    - trabajo.qmd

lang: es
bibliography: bibliografia.bib
csl: recursos/ieee.csl
number-sections: false
toc: false
crossref:
  fig-title: Figura
  tbl-title: Tabla
  fig-prefix: figura
  tbl-prefix: tabla
  eq-prefix: ecuación

execute:
  echo: false
  warning: false
  freeze: false

format:
  docx:
    reference-doc: recursos/plantilla.docx
    fig-width: 6.1
    fig-height: 3.3
    fig-dpi: 200
  typst:
    citeproc: true
    # Tipografía de la plantilla de la Escuela de Posgrado: Carta, márgenes de
    # 3 cm, Times New Roman 12; el interlineado 1.5 se fija en trabajo.qmd.
    papersize: us-letter
    margin:
      x: 3cm
      y: 3cm
    mainfont: Times New Roman
    fontsize: 12pt
    fig-width: 6.1
    fig-height: 3.3
    keep-typ: true
