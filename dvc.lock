schema: '2.0'
stages:
  prepare_eda_sample:
    cmd: uv run python -m src.data.prepare_eda
    deps:
    - path: data/raw/cfpb_reclamos_narrativa.parquet
      hash: md5
      md5: 68f4560aca0967779f118e8225e72c26
      size: 1616005038
    - path: src/data/agregados.py
      hash: md5
      md5: acb7f7bce1e665d7a166cd9acade6446
      size: 16774
    - path: src/data/load_raw.py
      hash: md5
      md5: 40111c33b5b20c90d24b8847addc3e03
      size: 2454
    - path: src/data/prepare_eda.py
      hash: md5
      md5: f81c63f8bbb4c22632a3acd729057248
      size: 11041
    - path: src/paths.py
      hash: md5
      md5: 7bcaff4d98841997471c8e2e43928977
      size: 748
    params:
      params.yaml:
        random_seed: 42
        sample:
          train_size: 100000
          validation_size: 25000
          test_size: 25000
          ood_2026_size: 25000
          batch_size: 131072
        splits:
          train:
            start: '2023-01-01'
            end: '2024-12-31'
          validation:
            start: '2025-01-01'
            end: '2025-06-30'
          test:
            start: '2025-07-01'
            end: '2025-12-31'
          ood_2026:
            start: '2026-01-01'
            end: '2026-12-31'
        text.hash_algorithm: sha1
        text.normalization_version: lower-whitespace-v1
    outs:
    - path: data/interim/eda_hash_groups.parquet
      hash: md5
      md5: c80bc492b39cdd1a3d2b144b4bfda67a
      size: 2697727
    - path: data/interim/eda_sample.parquet
      hash: md5
      md5: 7eb58e21982828c3f3e7152ad37cca21
      size: 53721622
    - path: reports/artefactos/eda_sample_hash_audit.csv
      hash: md5
      md5: a885d04fa65c0a4adf96835b9376a021
      size: 269
  build_tfidf:
    cmd: uv run python -m src.features.text
    deps:
    - path: data/interim/eda_sample.parquet
      hash: md5
      md5: 7eb58e21982828c3f3e7152ad37cca21
      size: 53721622
    - path: src/data/prepare_eda.py
      hash: md5
      md5: f81c63f8bbb4c22632a3acd729057248
      size: 11041
    - path: src/features/text.py
      hash: md5
      md5: e7eeacd93dfa600e2f763b2725aacb59
      size: 4073
    - path: src/paths.py
      hash: md5
      md5: 7bcaff4d98841997471c8e2e43928977
      size: 748
    params:
      params.yaml:
        tfidf:
          word:
            ngram_range:
            - 1
            - 2
            min_df: 3
            max_df: 0.98
            max_features: 150000
            sublinear_tf: true
          char:
            analyzer: char_wb
            ngram_range:
            - 3
            - 5
            min_df: 3
            max_features: 150000
            sublinear_tf: true
    outs:
    - path: data/processed/r0_index.parquet
      hash: md5
      md5: f83dc57493de9e3bcb7c48aa2c017998
      size: 4234392
    - path: data/processed/r0_manifest.json
      hash: md5
      md5: 0050225bf9e37a521a2ddd5b9eae9d5c
      size: 696
    - path: data/processed/r0_tfidf.npz
      hash: md5
      md5: 995d24ad423b8e972ced6cc0355c7a11
      size: 989538185
    - path: data/processed/r0_vectorizers.joblib
      hash: md5
      md5: d6952121d8b76b6fe42e0579e83025d6
      size: 2742873
  e12_baseline:
    cmd: uv run python -m src.models.baseline
    deps:
    - path: data/processed/r0_index.parquet
      hash: md5
      md5: f83dc57493de9e3bcb7c48aa2c017998
      size: 4234392
    - path: data/processed/r0_tfidf.npz
      hash: md5
      md5: 995d24ad423b8e972ced6cc0355c7a11
      size: 989538185
    - path: src/data/prepare_eda.py
      hash: md5
      md5: f81c63f8bbb4c22632a3acd729057248
      size: 11041
    - path: src/models/baseline.py
      hash: md5
      md5: 764d9174ac8f9ab522be0802e102f7d1
      size: 11830
    - path: src/paths.py
      hash: md5
      md5: 7bcaff4d98841997471c8e2e43928977
      size: 748
    params:
      params.yaml:
        baseline:
          alpha: 1e-05
          max_iter: 10
          tol: 0.001
          average: true
          class_weight_cap: 20.0
        random_seed: 42
    outs:
    - path: data/processed/e12_predictions.parquet
      hash: md5
      md5: 675eef2d6f6857db95b1b3f77b3fe7b5
