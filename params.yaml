# ============================================================================
# params.yaml · Decisiones declaradas del pipeline de preparación (dvc.yaml).
#
# Regla del curso: ningún umbral, lista ni constante de negocio vive dentro
# del código. Cada etapa declara aquí sus decisiones y las lee al cargarse
# (src/data/params.py); dvc.yaml nombra la sección de cada etapa y dvc.lock
# anota sus valores. Cambiar un valor invalida la etapa y queda visible en el
# Pull Request. Justificación: docs/decisiones/0002-preparacion-y-particion.md.
# ============================================================================

preparacion:
  type_data:                               # P1 · validar el esquema y tipar fechas
    entrada: data/raw/cfpb_reclamos_narrativa.parquet
    salida: data/interim/typed.parquet
    columnas_esperadas:                    # 16 columnas públicas de la CFPB, en orden
      - "Date received"
      - Product
      - Sub-product
      - Issue
      - Sub-issue
      - Consumer complaint narrative
      - Company public response
      - Company
      - State
      - ZIP code
      - Tags
      - Submitted via
      - Date sent to company
      - Company response to consumer
      - "Timely response?"
      - Complaint ID
    columnas_fecha: ["Date received", "Date sent to company"]
    formato_fecha: "%Y-%m-%d"

  normalize_text:                          # P2 · normalizar la narrativa
    entrada: data/interim/typed.parquet
    salida: data/interim/normalized.parquet
    version: text_normalizer_v1
    forma_unicode: NFKC
    patron_anonimizacion: '\bx{2,}\b'      # marcas XXXX de la CFPB (tras casefold)
    reemplazo_anonimizacion: "<redacted>"

  apply_taxonomy:                          # P3 · taxonomía propuesta
    entrada: data/interim/normalized.parquet
    salida: data/interim/taxonomy.parquet
    version: taxonomy_v1_proposed
    estado: proposed_no_business_review    # sin revisión de negocio
    fecha_congelamiento: 2025-06-30        # pares conocidos observados hasta aquí
    categoria_desconocida: "__UNKNOWN__"
    productos: configs/product_taxonomy_v1.csv
    motivos: configs/issue_taxonomy_v1.csv
    pares: configs/valid_product_issue_pairs_v1.csv

  build_targets:                           # P4 · objetivos, periodos y elegibilidad
    entrada: data/interim/taxonomy.parquet
    salida: data/interim/targets_periods.parquet
    estado_holdout: configs/holdout_review_status.json
    version: targets_periods_v1
    inicio_de_periodo:                     # antes del primero: context_2015_2022
      train_2023_2024: 2023-01-01
      validation_2025_h1: 2025-01-01
      holdout_2025_h2: 2025-07-01
      ood_2026_partial: 2026-01-01
    respuestas:                            # Company response to consumer
      con_solucion: ["Closed with monetary relief", "Closed with non-monetary relief"]
      sin_solucion: ["Closed with explanation"]
      monetaria: ["Closed with monetary relief"]
      # cualquier otra respuesta deja T2 y T3 como desconocidos
    respuesta_no_oportuna:                 # Timely response?
      positivo: "No"
      negativo: "Yes"

  finalize_prepared:                       # P5 · validar y publicar
    entrada: data/interim/targets_periods.parquet
    salida: data/processed/prepared.parquet
    filas_esperadas: 3837184

documentar:
  # Columnas que crea cada etapa, en el orden del grafo. document_prepared se
  # detiene si la tabla y esta lista no coinciden.
  columnas_por_etapa:
    type_data:
      - "Date received"
      - Product
      - Sub-product
      - Issue
      - Sub-issue
      - Consumer complaint narrative
      - Company public response
      - Company
      - State
      - ZIP code
      - Tags
      - Submitted via
      - Date sent to company
      - Company response to consumer
      - "Timely response?"
      - Complaint ID
    normalize_text:
      - Consumer complaint narrative normalized
      - Consumer complaint narrative SHA-256
    apply_taxonomy:
      - Product canonical
      - Issue canonical
      - known_product
      - known_issue
      - known_product_issue_pair
    build_targets:
      - period
      - T1
      - T2
      - T3
      - T4
      - known_T1
      - known_T2
      - known_T3
      - known_T4
      - previously_reviewed_id
      - excluded_by_reviewed_text_group
      - holdout_status
      - no_shared_reference_text
      - eligible_T1_complete
      - eligible_T2_complete
      - eligible_T3_complete
      - eligible_T4_complete
      - eligible_T1_no_shared_text
      - eligible_T2_no_shared_text
      - eligible_T3_no_shared_text
      - eligible_T4_no_shared_text
    finalize_prepared: []

  descripcion_etapas:
    type_data: "P1 · valida el esquema de 16 columnas y tipa las dos fechas"
    normalize_text: "P2 · normaliza la narrativa (text_normalizer_v1) y su SHA-256"
    apply_taxonomy: "P3 · aplica la taxonomía propuesta congelada al 2025-06-30"
    build_targets: "P4 · construye T1–T4, periodos, bloqueos y elegibilidad"
    finalize_prepared: "P5 · valida el contrato y publica la tabla sin transformarla"

  # Rol de cada columna en el contrato de modelado:
  # reports/modeling/evaluation_contract.json y docs/decisiones/0001-alcance-y-fugas.md.
  roles:
    identificador:
      - "Complaint ID"
    predictora:
      - "Consumer complaint narrative"
      - "Consumer complaint narrative normalized"
      - "Product"
      - "Sub-product"
      - "Product canonical"
    candidata:
      - "Company"
      - "State"
      - "Date received"
      - "ZIP code"
      - "Tags"
      - "Submitted via"
    posterior_al_evento:
      - "Issue"
      - "Sub-issue"
      - "Issue canonical"
      - "Company public response"
      - "Company response to consumer"
      - "Timely response?"
      - "Date sent to company"
    objetivo:
      - "T1"
      - "T2"
      - "T3"
      - "T4"
    control_de_evaluacion:
      - "Consumer complaint narrative SHA-256"
      - "known_product"
      - "known_issue"
      - "known_product_issue_pair"
      - "period"
      - "known_T1"
      - "known_T2"
      - "known_T3"
      - "known_T4"
      - "previously_reviewed_id"
      - "excluded_by_reviewed_text_group"
      - "holdout_status"
      - "no_shared_reference_text"
      - "eligible_T1_complete"
      - "eligible_T2_complete"
      - "eligible_T3_complete"
      - "eligible_T4_complete"
      - "eligible_T1_no_shared_text"
      - "eligible_T2_no_shared_text"
      - "eligible_T3_no_shared_text"
      - "eligible_T4_no_shared_text"

  # El diccionario no reproduce texto de reclamos: estas columnas no llevan ejemplo.
  columnas_sin_ejemplo:
    - Consumer complaint narrative
    - Consumer complaint narrative normalized
  ejemplo_max_caracteres: 40
