[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-claims-triage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.11.1",
    "mlflow>=3.0,<4",
    "numpy>=2.0,<3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
gpu = [
    "sentence-transformers>=5.1,<6",
]
dev = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
semantic = [
    "faiss-cpu>=1.12,<2",
    "pyclustering==0.10.1.2",
    "umap-learn>=0.5.9,<1",
]
# Block B of models_plan.md §25.4. TabPFN-3.5 weights are non-commercial;
# Kumo Tabular exists only on the package's main branch, pinned by commit.
foundation = [
    "tabpfn==9.1.0",
    "structured-data-models @ git+https://github.com/NVIDIA/structured-data-models@98f61289c7a4e1bce3b33771223ac2e123b63f19",
]
probabilistic = [
    "arviz>=0.22,<1",
    "graphviz>=0.20,<1",
    "jax[cpu]>=0.7,<1",
    "numpyro>=0.19,<1",
    "pymc>=5.25,<6",
]
