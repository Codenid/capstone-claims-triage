[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-claims-triage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.11.1",
    "mlflow>=3.0,<4",
    "numpy>=2.0,<3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
gpu = [
    "sentence-transformers>=5.1,<6",
]
dev = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
semantic = [
    "faiss-cpu>=1.12,<2",
    "pyclustering==0.10.1.2",
    "umap-learn>=0.5.9,<1",
]
