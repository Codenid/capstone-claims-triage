[project]
name = "capstone-claims-triage"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.9.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ty.environment]
python = ".venv"

[tool.pyright]
extraPaths = ["."]
