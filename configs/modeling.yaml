experiment:
  name: claims-triage-modeling
  seed: 42
  run_contract_version: modeling_run_v1

paths:
  input_data: data/processed/prepared.parquet
  input_contract: reports/modeling/input_contract.json
  evaluation_contract: reports/modeling/evaluation_contract.json
  baseline_report: reports/modeling/baseline_results.json
  baseline_t1_classes: reports/modeling/baseline_t1_per_class.csv
  tfidf_report: reports/modeling/tfidf_results.json
  tfidf_t1_classes: reports/modeling/tfidf_t1_per_class.csv
  tfidf_models: artifacts/models/tfidf
  offline_runs: reports/modeling/runs

evaluation:
  split_version: temporal_v1
  splits:
    fit:
      start: 2023-01-01
      end: 2024-10-01
    calibration:
      start: 2024-10-01
      end: 2025-01-01
    validation:
      start: 2025-01-01
      end: 2025-07-01
  views:
    - complete
    - no_shared_text
  selection_view: no_shared_text
  blocked_periods:
    - 2025-07-01/2026-01-01
    - 2026_partial
  metrics:
    T1:
      primary: macro_f1
      secondary:
        - top_3_accuracy
        - per_class_f1
    T2:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
    T3:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
    T4:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
  binary_threshold: max_f1_on_calibration_no_shared_text

tfidf:
  max_features: 100000
  ngram_range:
    - 1
    - 2
  min_df: 5
  sublinear_tf: true
  alpha: 0.00001
  max_iter: 10
  class_weight:
    T1: null
    T2: null
    T3: balanced
    T4: balanced
  calibration_method: sigmoid

features:
  initial:
    - Consumer complaint narrative normalized
    - Product canonical
  candidates:
    - Company
    - State
    - Date received
  excluded:
    - Issue
    - Sub-issue
    - Issue canonical
    - Company public response
    - Company response to consumer
    - Timely response?
    - Date sent to company
    - T1
    - T2
    - T3
    - T4
