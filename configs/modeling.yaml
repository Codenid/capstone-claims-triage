experiment:
  name: claims-triage-modeling
  seed: 42
  run_contract_version: modeling_run_v1

paths:
  input_data: data/processed/prepared.parquet
  input_contract: reports/modeling/input_contract.json
  evaluation_contract: reports/modeling/evaluation_contract.json
  baseline_report: reports/modeling/baseline_results.json
  baseline_t1_classes: reports/modeling/baseline_t1_per_class.csv
  tfidf_report: reports/modeling/tfidf_results.json
  tfidf_t1_classes: reports/modeling/tfidf_t1_per_class.csv
  tfidf_models: artifacts/models/tfidf
  bge_report: reports/modeling/bge_sample_results.json
  bge_artifacts: artifacts/models/bge_sample
  bge_artifacts_dvc: artifacts/models/bge_sample.dvc
  semantic_report: reports/modeling/semantic_space_results.json
  semantic_pca_plot: reports/modeling/semantic_pca_variance.png
  semantic_umap_plot: reports/modeling/semantic_umap_2d.png
  semantic_artifacts: artifacts/models/semantic_space
  semantic_artifacts_dvc: artifacts/models/semantic_space.dvc
  clustering_report: reports/modeling/clustering_results.json
  clustering_candidates: reports/modeling/clustering_candidates.csv
  clustering_silhouette_plot: reports/modeling/clustering_silhouette.png
  clustering_umap_plot: reports/modeling/clustering_umap_2d.png
  clustering_sizes_plot: reports/modeling/clustering_sizes.png
  clustering_artifacts: artifacts/models/clustering_comparison
  offline_runs: reports/modeling/runs

evaluation:
  split_version: temporal_v1
  splits:
    fit:
      start: 2023-01-01
      end: 2024-10-01
    calibration:
      start: 2024-10-01
      end: 2025-01-01
    validation:
      start: 2025-01-01
      end: 2025-07-01
  views:
    - complete
    - no_shared_text
  selection_view: no_shared_text
  blocked_periods:
    - 2025-07-01/2026-01-01
    - 2026_partial
  metrics:
    T1:
      primary: macro_f1
      secondary:
        - top_3_accuracy
        - per_class_f1
    T2:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
    T3:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
    T4:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
  binary_threshold: max_f1_on_calibration_no_shared_text

tfidf:
  max_features: 100000
  ngram_range:
    - 1
    - 2
  min_df: 5
  sublinear_tf: true
  alpha: 0.00001
  max_iter: 30
  class_weight:
    T1: null
    T2: null
    T3: balanced
    T4: balanced
  calibration_method: sigmoid

bge:
  model: BAAI/bge-large-en-v1.5
  revision: d4aa6901d3a41ba39fb536a557fa166f842b0e09
  max_sequence_length: 512
  batch_size: 64
  linear_max_iter: 120
  sample_rows:
    fit: 120000
    calibration: 40000
    validation: 80000

semantic_space:
  source_dvc_hash: 009e3b35e25d9df095cf753e0a05f041.dir
  embedding_dimensions: 1024
  normalization_tolerance: 0.001
  batch_rows: 8192
  pca:
    n_components: 256
    variance_checkpoints:
      - 32
      - 64
      - 128
      - 256
  umap:
    n_components: 2
    n_neighbors: 15
    min_dist: 0.1
    metric: euclidean
    init: random
    plot_rows_per_split: 10000
  faiss:
    index_type: flat_inner_product
    metric: cosine
    neighbors: 10
    query_rows_per_split: 1000
    exact_check_rows_per_split: 8
    threads: 16

clustering:
  source_dvc_hash: 08662a82971a71666b06c9ccf8120d7f.dir
  comparison_rows: 20000
  silhouette_rows: 5000
  semantic_neighbors: 10
  stability_fraction: 0.8
  stability_seeds:
    - 42
    - 43
    - 44
  umap:
    n_components: 15
    n_neighbors: 15
    min_dist: 0.1
    metric: euclidean
    init: random
  kmeans:
    clusters:
      - 20
      - 40
      - 80
    batch_size: 4096
    n_init: 5
    max_iter: 100
  hdbscan:
    min_cluster_size:
      - 100
      - 250
      - 500
    min_samples:
      - 10
      - 30
  cure:
    candidates:
      - clusters: 20
        representatives: 5
        compression: 0.5
      - clusters: 40
        representatives: 5
        compression: 0.5
      - clusters: 80
        representatives: 5
        compression: 0.5
  acceptance:
    minimum_clusters: 5
    maximum_clusters: 100
    maximum_largest_cluster_fraction: 0.5
    maximum_small_cluster_fraction: 0.1
    small_cluster_rows: 50
    maximum_noise_fraction: 0.4
    minimum_silhouette: 0.0
    maximum_negative_silhouette_fraction: 0.35
    minimum_neighbor_lift: 0.1
    minimum_stability_ari: 0.6
    minimum_future_coverage: 0.7
    maximum_template_dominated_fraction: 0.25

features:
  initial:
    - Consumer complaint narrative normalized
    - Product canonical
  candidates:
    - Company
    - State
    - Date received
  excluded:
    - Issue
    - Sub-issue
    - Issue canonical
    - Company public response
    - Company response to consumer
    - Timely response?
    - Date sent to company
    - T1
    - T2
    - T3
    - T4
