experiment:
  name: claims-triage-modeling
  seed: 42
  run_contract_version: modeling_run_v1
  # Course tag `version_datos`: one data version so far (prepared.parquet,
  # MD5 d189a3ae…, from dvc.lock on 2026-09-18).
  data_version: datos-v1

paths:
  input_data: data/processed/prepared.parquet
  input_contract: reports/modeling/input_contract.json
  evaluation_contract: reports/modeling/evaluation_contract.json
  baseline_report: reports/modeling/baseline_results.json
  baseline_t1_classes: reports/modeling/baseline_t1_per_class.csv
  tfidf_report: reports/modeling/tfidf_results.json
  tfidf_t1_classes: reports/modeling/tfidf_t1_per_class.csv
  tfidf_models: artifacts/models/tfidf
  bge_report: reports/modeling/bge_sample_results.json
  bge_artifacts: artifacts/models/bge_sample
  bge_artifacts_dvc: artifacts/models/bge_sample.dvc
  semantic_report: reports/modeling/semantic_space_results.json
  semantic_pca_plot: reports/modeling/semantic_pca_variance.png
  semantic_umap_plot: reports/modeling/semantic_umap_2d.png
  semantic_artifacts: artifacts/models/semantic_space
  semantic_artifacts_dvc: artifacts/models/semantic_space.dvc
  clustering_report: reports/modeling/clustering_results.json
  clustering_candidates: reports/modeling/clustering_candidates.csv
  clustering_silhouette_plot: reports/modeling/clustering_silhouette.png
  clustering_umap_plot: reports/modeling/clustering_umap_2d.png
  clustering_sizes_plot: reports/modeling/clustering_sizes.png
  clustering_artifacts: artifacts/models/clustering_comparison
  clustering_artifacts_dvc: artifacts/models/clustering_comparison.dvc
  space_sensitivity_report: reports/modeling/space_sensitivity/results.json
  space_sensitivity_candidates: reports/modeling/space_sensitivity/candidates.csv
  space_sensitivity_artifacts: artifacts/models/space_sensitivity
  bge_full_report: reports/modeling/bge_full_results.json
  bge_full_artifacts: artifacts/models/bge_full
  bge_full_artifacts_dvc: artifacts/models/bge_full.dvc
  bge_full_staging: artifacts/models/.bge_full.inprogress
  weekly_patterns_report: reports/modeling/weekly_patterns_results.json
  weekly_counts: reports/modeling/weekly_counts.csv
  daily_counts: reports/modeling/daily_counts.csv
  cluster_summary: reports/modeling/cluster_summary.csv
  weekly_cluster_size_plot: reports/modeling/weekly_cluster_sizes.png
  weekly_patterns_plot: reports/modeling/weekly_patterns.png
  weekly_patterns_artifacts: artifacts/models/weekly_patterns
  weekly_patterns_artifacts_dvc: artifacts/models/weekly_patterns.dvc
  weekly_patterns_staging: artifacts/models/.weekly_patterns.inprogress
  representation_report: reports/modeling/representation_results.json
  representation_artifacts: artifacts/models/representation_comparison
  representation_staging: artifacts/models/.representation_comparison.inprogress
  persistent_change_reports: reports/modeling/persistent_change

  offline_runs: reports/modeling/runs

evaluation:
  split_version: temporal_v1
  splits:
    fit:
      start: 2023-01-01
      end: 2024-10-01
    calibration:
      start: 2024-10-01
      end: 2025-01-01
    validation:
      start: 2025-01-01
      end: 2025-07-01
  views:
    - complete
    - no_shared_text
  selection_view: no_shared_text
  blocked_periods:
    - 2025-07-01/2026-01-01
    - 2026_partial
  metrics:
    T1:
      primary: macro_f1
      secondary:
        - top_3_accuracy
        - per_class_f1
    T2:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
    T3:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
    T4:
      primary: average_precision
      secondary:
        - precision
        - recall
        - brier_score
  binary_threshold: max_f1_on_calibration_no_shared_text

tfidf:
  max_features: 100000
  ngram_range:
    - 1
    - 2
  min_df: 5
  sublinear_tf: true
  alpha: 0.00001
  max_iter: 30
  class_weight:
    T1: null
    T2: null
    T3: balanced
    T4: balanced
  calibration_method: sigmoid

bge:
  model: BAAI/bge-large-en-v1.5
  revision: d4aa6901d3a41ba39fb536a557fa166f842b0e09
  max_sequence_length: 512
  batch_size: 64
  linear_max_iter: 120
  sample_rows:
    fit: 120000
    calibration: 40000
    validation: 80000

semantic_space:
  source_dvc_hash: 009e3b35e25d9df095cf753e0a05f041.dir
  embedding_dimensions: 1024
  normalization_tolerance: 0.001
  batch_rows: 8192
  pca:
    n_components: 256
    variance_checkpoints:
      - 32
      - 64
      - 128
      - 256
  umap:
    n_components: 2
    n_neighbors: 15
    min_dist: 0.1
    metric: euclidean
    init: random
    plot_rows_per_split: 10000
  faiss:
    index_type: flat_inner_product
    metric: cosine
    neighbors: 10
    query_rows_per_split: 1000
    exact_check_rows_per_split: 8
    threads: 16

bge_full:
  contract_version: bge_full_v1
  source_dvc_hash: 009e3b35e25d9df095cf753e0a05f041.dir
  eligible_column: eligible_T1_complete
  embedding_dimensions: 1024
  source_batch_rows: 131072
  arrow_batch_rows: 8192
  artifact_shard_rows: 200000
  artifact_shard_threshold_rows: 800000
  normalization_tolerance: 0.001
  expected_rows:
    fit: 1067194
    calibration: 234600
    validation: 695184
  expected_reused_rows:
    fit: 120000
    calibration: 40000
    validation: 80000

# M5B: T1-T4 representations with every fit row and the tie rule approved on
# 2026-09-30 (models_plan.md §21).
representations:
  source_dvc_hash: 3ff36a299da1f2e19a00a4bce49f18ad.dir
  minimum_relative_gain: 0.05
  bootstrap_draws: 2000

# M11: CUSUM against the weekly excess rule, approved on 2026-10-01
# (models_plan.md §24).
persistent_change:
  # Redone with C-A after block C (models_plan.md §25.5). The first M11 used
  # nb_rolling_4_hierarchical_v3, run 20260927T161316.494762Z-full-a3ecfab3-9105ce1f,
  # wrote reports/modeling/persistent_change and published m11-persistent-change-*.
  m9_model: nb_discounted_hierarchical_v1
  m9_run_key: 20261005T200606.263137Z-full-0aa0a0fb-2348e548
  report_dir: reports/modeling/persistent_change_c_a
  run_name: m11-persistent-change-c-a
  cusum_k: 0.5
  false_alarms_per_month: 1
  simulation_series: 2000
  simulation_weeks: 5000
  horizon_weeks: 8
  pit_tolerance: 0.06
  minimum_detection_gain: 0.05
  deciding_scenarios: [growth_10, growth_20]
  scenarios:
    growth_10: {kind: growth, size: 0.10}
    growth_20: {kind: growth, size: 0.20}
    step_50: {kind: step, size: 0.50}
    step_100: {kind: step, size: 1.00}
    none: {kind: none, size: 0.0}

# C-A of the round approved on 2026-10-03 (models_plan.md §25.5): decaying
# memory and a cap on atypical weeks, chosen in fit with the v3 dispersion.
discount_grid:
  reference_config: configs/weekly_counts/nb_rolling_4_hierarchical_v3.yaml
  reference_run: reports/modeling/weekly_counts/nb_rolling_4_hierarchical_v3/20260927T161316.494762Z-full-a3ecfab3-9105ce1f
  report: reports/modeling/weekly_counts/nb_discounted_hierarchical_v1/share_selection.json
  warmup_weeks: 4
  discounts: [0.5, 0.6, 0.7, 0.75, 0.8, 0.9]
  caps: [1.5, 2, 3, null]

# Block C of the round approved on 2026-10-03 (models_plan.md §25.2 and
# §25.5): every candidate is compared with the frozen M9 in calibration.
m9_challenge:
  reference_run: reports/modeling/weekly_counts/nb_rolling_4_hierarchical_v3/20260927T161316.494762Z-full-a3ecfab3-9105ce1f
  report_dir: reports/modeling/weekly_counts/challenges
  minimum_wis_gain: 0.05
  acceptance:
    coverage_80_minimum: 0.70
    coverage_80_maximum: 0.90
    coverage_95_minimum: 0.88
    coverage_95_maximum: 0.99

# Block B of the round approved on 2026-10-03 and 2026-10-05 (models_plan.md
# §25.4): TabPFN-3.5 and Kumo Tabular against the frozen T1. Weights live
# outside the repo; the SLURM nodes read them offline.
foundation_t1:
  bge_full_dvc_hash: 3ff36a299da1f2e19a00a4bce49f18ad.dir
  semantic_dvc_hash: 08662a82971a71666b06c9ccf8120d7f.dir
  # Kumo Tabular left on 2026-10-06 (models_plan.md §25.4): it ran out of GPU
  # memory with 50,000 rows and of RAM with 20,000 rows and 8 estimators.
  candidates: [tabpfn]
  reference_dvc: artifacts/models/representation_comparison.dvc
  reference_dvc_hash: ecf6c9262d0e9a44ad9ea97617e316ba.dir
  reference_predictions: artifacts/models/representation_comparison/calibration_t1.parquet
  pca_components: 100
  # 50,000 rows ran out of GPU memory in Kumo Tabular (SLURM 54590).
  context_rows: 20000
  estimators: 8
  query_batch_rows: 5000
  minimum_relative_gain: 0.05
  bootstrap_draws: 2000
  tabpfn_model_path: ~/models/tabpfn_3_5/tabpfn-v3.5-20260909.safetensors
  kumo_size: large
  report: reports/modeling/foundation_t1/results.json
  validation_report: reports/modeling/foundation_t1/validation_results.json
  artifacts: artifacts/models/foundation_t1

# Input ablation of TabPFN-3.5 (models_plan.md §26), pre-registered on
# 2026-10-07: same context, estimators and seed as block B; only the numerical
# input changes. The reference is TabPFN-100's saved calibration predictions.
foundation_t1_ablation:
  inputs:
    tabpfn_pca256: 256
    tabpfn_bge1024: null
  reference_dvc: artifacts/models/foundation_t1.dvc
  reference_dvc_hash: 5ee008be5b45badae71d95e7007bb1f4.dir
  reference_predictions: artifacts/models/foundation_t1/calibration_t1.parquet
  ablation_report: reports/modeling/foundation_t1/ablation_results.json
  ablation_artifacts: artifacts/models/foundation_t1_ablation

# Block C foundation models (models_plan.md §25.5), approved on 2026-10-06:
# zero-shot, on CPU, with weights fetched on the login node.
foundation_series:
  reference_config: configs/weekly_counts/nb_rolling_4_hierarchical_v3.yaml
  chronos2_path: ~/models/chronos_2
  timesfm3_path: ~/models/timesfm_3

# Daily discount grid (models_plan.md §28.2): the discount of the daily memory
# is chosen in fit by plug-in WIS with the dispersion of the D-A pilot.
daily_discount_grid:
  reference_config: configs/daily_counts/nb_daily_hierarchical_v1.yaml
  reference_run: reports/modeling/daily_counts/nb_daily_hierarchical_v1/20261008T024420.718441Z-pilot-35d86adc-24306eed
  report: reports/modeling/daily_counts/nb_daily_hierarchical_v1/share_selection.json
  discounts: [0.7, 0.8, 0.9]
  warmup_days: 7
  window_days: 7

# Daily composition D-E (models_plan.md §28.2): Dirichlet-multinomial of the
# day's vector with a 7-day decaying memory, scored by joint log score.
daily_composition:
  reference_config: configs/daily_counts/nb_daily_hierarchical_v1.yaml
  report_dir: reports/modeling/daily_counts/dirichlet_multinomial_daily_v1
  artifact_dir: artifacts/models/daily_counts/dirichlet_multinomial_daily_v1
  share_concentration: 1.0
  priors: {log_kappa_mean: 4.605170186, log_kappa_sigma: 1.0}
  # Exact 1-D grid posterior of log kappa (the MCMC timed out, SLURM 54866).
  grid_points: 2001
  grid_width: 6.0
  sampling: {prediction_draws: 2000}
  pilot_sampling: {prediction_draws: 500}
  alert_p_value: 0.01
  kappa_draws: 100
  simulations_per_draw: 20

# Daily state space D-B (models_plan.md §28.2): random walk per pattern on
# the logit shares, hyperparameters fixed after fit, states re-estimated in
# blocks of 7 days through calibration.
daily_state_space:
  reference_config: configs/daily_counts/nb_daily_hierarchical_v1.yaml
  report_dir: reports/modeling/daily_counts/nb_daily_state_space_v1
  artifact_dir: artifacts/models/daily_counts/nb_daily_state_space_v1
  block_days: 7
  pilot_calibration_days: 7
  priors:
    initial_sigma: 2.0
    tau_sigma: 0.1
    nu_alpha: 2.0
    nu_beta: 0.1
    log_alpha_global_mean: 2.302585093
    log_alpha_global_sigma: 1.0
    log_alpha_sigma: 0.75
    beta_sigma: 0.5
  sampling:
    backend: numpyro
    chain_method: parallel
    chains: 4
    draws: 1000
    tune: 1000
    target_accept: 0.9
    max_treedepth: 12
    prediction_draws: 1000
  pilot_sampling: {chains: 2, draws: 200, tune: 200, prediction_draws: 300}
  state_sampling: {chains: 2, draws: 300, tune: 300}

# Daily winner (models_plan.md §28.2): the lowest calibration WIS among the
# accepted full runs; the pairwise bootstrap among them is reported only.
daily_challenge:
  report_dir: reports/modeling/daily_counts/challenge

# Daily alert rule D-11 (models_plan.md §28.3): 4 false alarms a month over
# the 40 patterns; bursts injected in calibration; the weekly CUSUM of M11 is
# run on the same bursts aggregated to weeks.
daily_change:
  # Winner of the daily challenge of 2026-10-08 (§28.2): D-D.
  m9d_model: zinb_daily_hierarchical_v1
  m9d_run_key: 20261008T040100.226680Z-full-2e0a6b9e-2eb7afd9
  report_dir: reports/modeling/daily_change
  run_name: m11d-daily-change
  prediction_draws: 2000
  # Plug-in posterior medians of beta and pi reproduce the run's expected_mean
  # (a posterior mean of a nonlinear function) within 1.45%; the check guards
  # against gross errors such as a wrong discount or day order (>= 10%).
  expected_tolerance: 0.02
  warmup_days: 7
  cusum_k: 0.5
  false_alarms_per_month: 4
  simulation_series: 2000
  simulation_days: 5000
  horizon_days: 14
  starts_per_pattern: 25
  compare_weekly: true
  minimum_detection: 0.5
  maximum_median_delay: 2
  deciding_scenarios: [burst_x2_3d, burst_x3_1d]
  scenarios:
    burst_x2_3d: {kind: burst, size: 2.0, days: 3}
    burst_x3_1d: {kind: burst, size: 3.0, days: 1}
    rise_x1_5_7d: {kind: burst, size: 1.5, days: 7}
    none: {kind: none, size: 1.0, days: 0}

# Pattern catalogue (asked by the advisor on 2026-10-07): what each of the 40
# patterns is about and its weekly series with the current M9 band.
pattern_catalog:
  examples: 3
  snippet_characters: 240
  report_dir: reports/modeling/patterns

# Weekly mixture signal (models_plan.md §27), pre-registered on 2026-10-07:
# posterior predictive p-value of M10's joint log score, one per week.
mixture_signal:
  m10_model: dirichlet_multinomial_rolling_4_v1
  m10_run_key: 20261001T015410.667626Z-full-cff27014-1fa6f95c
  kappa_draws: 100
  simulations_per_draw: 20
  alert_p_value: 0.01
  report_dir: reports/modeling/weekly_composition/mixture_signal
  run_name: m10-mixture-signal

# Evidence card (docs/registro/models_plan.md §25, decision of 2026-10-06):
# a few real calibration complaints with the five frozen signals, no action.
evidence_card:
  products: 3
  neighbors: 5
  # Five queries: TabPFN runs on CPU, so the card does not wait for a GPU.
  device: cpu
  facts: reports/evidence_card/facts.json

clustering:
  source_dvc_hash: 08662a82971a71666b06c9ccf8120d7f.dir
  comparison_rows: 20000
  silhouette_rows: 5000
  semantic_neighbors: 10
  stability_fraction: 0.8
  stability_seeds:
    - 42
    - 43
    - 44
  umap:
    n_components: 15
    n_neighbors: 15
    min_dist: 0.1
    metric: euclidean
    init: random
  kmeans:
    clusters:
      - 20
      - 40
      - 80
    batch_size: 4096
    n_init: 5
    max_iter: 100
  hdbscan:
    min_cluster_size:
      - 100
      - 250
      - 500
    min_samples:
      - 10
      - 30
  cure:
    candidates:
      - clusters: 20
        representatives: 5
        compression: 0.5
      - clusters: 40
        representatives: 5
        compression: 0.5
      - clusters: 80
        representatives: 5
        compression: 0.5
  acceptance:
    minimum_clusters: 5
    maximum_clusters: 100
    maximum_largest_cluster_fraction: 0.5
    maximum_small_cluster_fraction: 0.1
    small_cluster_rows: 50
    maximum_noise_fraction: 0.4
    minimum_silhouette: 0.0
    maximum_negative_silhouette_fraction: 0.35
    minimum_neighbor_lift: 0.1
    minimum_stability_ari: 0.6
    minimum_future_coverage: 0.7
    maximum_template_dominated_fraction: 0.25

# M7S, block A of the round approved on 2026-10-03 (models_plan.md §25.3): the
# M7 grid plus GMM in every space, chosen by the BGE neighbor lift.
space_sensitivity:
  bge_dvc_hash: 009e3b35e25d9df095cf753e0a05f041.dir
  semantic_dvc_hash: 08662a82971a71666b06c9ccf8120d7f.dir
  clustering_dvc_hash: 425408aa84d0e2a44b8c5becd467e724.dir
  reference_space: umap15_s42
  reference_candidate: kmeans_k40
  spaces:
    pca128: {kind: pca, components: 128}
    pca256: {kind: pca, components: 256}
    pca512: {kind: pca, components: 512}
    umap5_s42: {kind: umap, components: 5, seed: 42}
    umap10_s42: {kind: umap, components: 10, seed: 42}
    umap15_s42: {kind: umap, components: 15, seed: 42, reuse_m7: true}
    umap30_s42: {kind: umap, components: 30, seed: 42}
    umap15_s43: {kind: umap, components: 15, seed: 43}
    umap15_s44: {kind: umap, components: 15, seed: 44}
  gmm:
    components: [20, 40, 80]
    covariance: {pca: diag, umap: full}
    max_iter: 200
    n_init: 1
    # 1e-6 made the UMAP covariances singular in SLURM 54197; PCA variances
    # are far smaller, so PCA keeps 1e-6.
    reg_covar: {pca: 1.0e-6, umap: 1.0e-3}
  minimum_relative_gain: 0.05
  bootstrap_draws: 2000
  change_ari: 0.6
  reproduction_ari: 0.99
  threads: 4

weekly_patterns:
  source_dvc_hash: 3ff36a299da1f2e19a00a4bce49f18ad.dir
  semantic_dvc_hash: 08662a82971a71666b06c9ccf8120d7f.dir
  clustering_dvc_hash: 425408aa84d0e2a44b8c5becd467e724.dir
  clusters: 40
  batch_rows: 8192
  umap_dimensions: 15
  n_init: 5
  kmeans_batch_size: 4096
  max_iter: 100
  novelty_quantile: 0.99
  term_rows_per_cluster: 1000
  top_terms: 10
  term_max_features: 50000


features:
  initial:
    - Consumer complaint narrative normalized
    - Product canonical
  candidates:
    - Company
    - State
    - Date received
  excluded:
    - Issue
    - Sub-issue
    - Issue canonical
    - Company public response
    - Company response to consumer
    - Timely response?
    - Date sent to company
    - T1
    - T2
    - T3
    - T4
