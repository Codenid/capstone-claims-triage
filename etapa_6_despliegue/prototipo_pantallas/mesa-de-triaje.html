<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatorio de reclamos</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#14263d;background:#f5f8fc;
  --blue:#1769aa;--navy:#12365a;--pale:#eaf3fb;--line:#dce6f0;--muted:#65778b;--white:#fff;--warn:#b45309;--warn-bg:#fdf3e4;--alert:#b3261e;--alert-bg:#fdecea;--ok:#1b6e3c}
*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--blue)}
.top{background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:16px max(16px,calc((100% - 1180px)/2))}
.mark{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#12365a,#1769aa)}
.mark svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round}
.brand{font-weight:700;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-weight:400;font-size:12px;margin-top:3px}
.notice{background:var(--pale);border-bottom:1px solid var(--line);color:#33526f;font-size:13px;line-height:1.5;padding:10px max(16px,calc((100% - 1180px)/2))}
main{max-width:1180px;margin:auto;padding:36px 16px 64px}
.eyebrow{color:var(--blue);text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700}
h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.035em;line-height:1.15;margin:10px 0 8px}
h2{font-size:16px;margin:0 0 14px}
.lead{color:var(--muted);line-height:1.6;margin:0 0 24px;max-width:70ch}
.back{border:0;background:transparent;color:var(--blue);padding:0;margin:0 0 18px;font-size:13px;font-weight:650}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.role{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:left;display:flex;flex-direction:column;min-height:210px;box-shadow:0 4px 18px #15395c08}
.role:hover{border-color:#8bb8df}.role h2{font-size:20px;margin:0 0 8px}.role p{color:var(--muted);line-height:1.55;margin:0}
.role .go{color:var(--blue);font-size:13px;font-weight:650;margin-top:auto;padding-top:20px}
.icon{width:46px;height:46px;border-radius:14px;background:var(--pale);color:var(--blue);display:grid;place-items:center;margin-bottom:22px}
.icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.panel{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:20px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi span{display:block;color:var(--muted);font-size:12px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em;margin:6px 0 2px}.kpi small{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.bar label{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
select,.btn{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:8px 12px;font-size:13px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650}
.btn.on{background:var(--pale);border-color:#8bb8df;color:var(--blue);font-weight:650}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #eef3f8;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover{background:#f6f9fc}
tr.alerta{background:var(--alert-bg)}tr.arriba{background:var(--warn-bg)}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:650;background:var(--pale);color:var(--blue);white-space:nowrap}
.tag.alerta{background:var(--alert-bg);color:var(--alert)}.tag.arriba{background:var(--warn-bg);color:var(--warn)}.tag.ok{background:#e8f4ec;color:var(--ok)}.tag.gris{background:#eef2f6;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.motive{background:#f6f9fc;border-radius:12px;padding:12px 14px;margin-bottom:8px}
.motive .row{display:flex;justify-content:space-between;gap:12px;font-size:14px}.motive .row b{font-weight:650}
.meter{height:4px;border-radius:4px;background:#e3ebf3;margin-top:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--blue)}
.small{font-size:12px;color:var(--muted);line-height:1.55}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.fact{background:#f6f9fc;border-radius:10px;padding:12px}.fact span{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.fact b{font-size:13px;font-weight:650;word-break:break-word}
details{margin-top:12px;font-size:13px;line-height:1.6}summary{cursor:pointer;color:var(--blue);font-weight:650}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.step{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;color:var(--muted)}
.step.done{background:#e8f4ec;border-color:#b9dcc6;color:var(--ok)}.step.now{background:var(--pale);border-color:#8bb8df;color:var(--navy);font-weight:650}
.quote{border-left:3px solid var(--line);margin:10px 0 0;padding:2px 0 2px 12px;color:#31465d;font-size:13px;line-height:1.6}
svg.chart{width:100%;height:auto;display:block}
.foot{color:#8796a7;font-size:12px;margin-top:28px;line-height:1.6}
@media (max-width:640px){.steps{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

</header>

<script>
"use strict";
const F = JSON.parse(document.getElementById("foto").textContent);
const app = document.getElementById("app");
const PATTERN = Object.fromEntries((F.patterns || []).map(p => [p.id, p]));
const COMPLAINT = Object.fromEntries((F.complaints || []).map(c => [c.id, c]));
const CFPB = "https://www.consumerfinance.gov/data-research/consumer-complaints/search/detail/";
const OUTCOMES = ["Aumento real", "Eco de una ráfaga anterior", "Reasignación entre patrones", "Descartada"];
const STEPS = ["Registrar la alerta", "Revisar con el área responsable", "Intervenir", "Cerrar el seguimiento"];

// Lo que la persona confirma, corrige o marca vive solo mientras la página está abierta.
const feedback = {};
const alerts = {};
const view = {scale: "week", period: null, rising: false, day: "all"};

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = x => Math.round(x).toLocaleString("en-US");
const pct = (x, d = 0) => (100 * x).toFixed(d) + " %";
const date = iso => { const [y, m, d] = iso.split("-"); return `${d}/${m}/${y}`; };
const short = iso => iso.slice(8, 10) + "/" + iso.slice(5, 7);
const link = id => `<a href="${CFPB}${esc(id)}" target="_blank" rel="noopener">${esc(id)}</a>`;
const patternName = id => `Patrón ${String(id).padStart(2, "0")}`;
const terms = p => p.terms.slice(0, 4).join(", ");
const alertKey = (week, id) => week + "|" + id;

// Estado de un patrón en un periodo: la alerta formal solo existe por semana.
function status(row, weekly) {
  const [obs, , p10, p90] = row;
  if (weekly && row[6]) return ["alerta", "Alerta de crecimiento"];
  if (obs > p90) return ["arriba", "Por encima del intervalo"];
  if (obs < p10) return ["gris", "Por debajo del intervalo"];
  return ["ok", "Dentro de lo esperado"];
}
function reliability(p) {
  if (p.frontier < 0.1) return "alta";
  if (p.frontier < 0.3) return "media";
  return "baja: sus reclamos quedan cerca de otro patrón y un aumento puede ser una reasignación";
}

function menu() {
  const card = (hash, title, text, go, icon) => `
    <button class="role" onclick="location.hash='${hash}'"><div class="icon"><svg viewBox="0 0 24 24">${icon}</svg></div>
    <h2>${title}</h2><p>${text}</p><div class="go">${go} →</div></button>`;
  app.innerHTML = `<div class="eyebrow">Menú principal</div><h1>Menú principal</h1>
    <p class="lead">Apoyo al triaje de reclamos: evidencia por reclamo y por patrón. Ninguna pantalla decide; la decisión es de la persona.</p>
    <div class="cards">
    ${card("#bandeja", "Bandeja de expedientes", "Consulta los reclamos recibidos, sus motivos sugeridos y la ficha de evidencia de cada uno.", "Abrir mesa de trabajo", '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M18 20c0-2-1-4-3-4.6"/>')}
    ${card("#patrones", "Observatorio de patrones", "Lo observado frente a lo esperado en cada patrón semántico, por semana y por día.", "Abrir observatorio", '<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"/>')}
    ${card("#alertas", "Seguimiento de alertas", "Revisa las alertas de crecimiento y registra qué se hizo con cada una.", "Abrir seguimiento", '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0"/>')}
    </div>`;
}

function bandeja() {
  const days = [...new Set(F.complaints.map(c => c.date))];
  const rows = F.complaints.filter(c => view.day === "all" || c.date === view.day);
  app.innerHTML = `<button class="back" onclick="location.hash='#menu'">← Menú principal</button>
    <h1>Bandeja de expedientes</h1>
    <p class="lead">Muestra de ${F.meta.sample} reclamos entre los ${num(F.meta.rows)} que el pipeline puntuó en el periodo. El motivo sugerido es el más probable de los tres que entrega el modelo.</p>
    <div class="panel"><div class="bar"><label>Fecha de recepción
      <select onchange="view.day=this.value;bandeja()"><option value="all">Todas</option>
      ${days.map(d => `<option value="${d}" ${d === view.day ? "selected" : ""}>${date(d)}</option>`).join("")}</select></label>
      <span class="small">${rows.length} expedientes</span></div>
    <div class="scroll"><table><thead><tr><th>ID del expediente</th><th>Recepción</th><th>Producto</th><th>Motivo sugerido</th><th class="n">Prob.</th><th>Patrón</th><th>Revisión</th></tr></thead><tbody>
    ${rows.map(c => `<tr class="click" onclick="location.hash='#reclamo/${c.id}'"><td><b>${esc(c.id)}</b></td><td>${date(c.date)}</td><td>${esc(c.product)}</td>
      <td>${esc(c.top[0][0])}</td><td class="n">${pct(c.top[0][1])}</td><td>${patternName(c.pattern)}${c.novel ? ' <span class="tag arriba">Novedoso</span>' : ""}</td>
      <td>${feedback[c.id] ? `<span class="tag ok">${feedback[c.id].kind}</span>` : '<span class="tag gris">Pendiente</span>'}</td></tr>`).join("")}
    </tbody></table></div></div>
    <p class="foot">Producto y motivo se muestran con los nombres de la taxonomía pública de la CFPB.</p>`;
}

function saveFeedback(id, kind, issue) { feedback[id] = {kind, issue}; reclamo(id); }

function reclamo(id) {
  const c = COMPLAINT[id];
  if (!c) { location.hash = "#bandeja"; return; }
  const p = PATTERN[c.pattern], fb = feedback[id];
  const probable = (likely, value, threshold) => `<b>${likely ? "Probable" : "Poco probable"}</b> · ${pct(value, 1)}
    <div class="meter"><i style="width:${Math.max(1, 100 * value)}%"></i></div><p class="small">Se marca «probable» desde ${pct(threshold)}; el umbral se fijó en calibración.</p>`;
  const rank = c.top.findIndex(t => t[0] === c.issue);
  app.innerHTML = `<button class="back" onclick="location.hash='#bandeja'">← Bandeja de expedientes</button>
    <h1>Ficha de evidencia: ${esc(c.id)}</h1>
    <div class="grid">
      <div class="panel"><h2>Datos recibidos</h2>
        <div class="facts"><div class="fact"><span>Recepción</span><b>${date(c.date)}</b></div><div class="fact"><span>Producto</span><b>${esc(c.product)}</b></div>
        <div class="fact"><span>Registro público</span><b>${link(c.id)}</b></div></div>
        <p class="small">La foto fija no guarda el texto del reclamo. Se consulta en la base pública de la CFPB con el identificador.</p></div>
      <div class="panel"><h2>Motivos sugeridos</h2>
        ${c.top.map((t, k) => `<div class="motive"><div class="row"><span>Motivo ${k + 1}<br><b>${esc(t[0])}</b></span><span>${pct(t[1])}</span></div><div class="meter"><i style="width:${100 * t[1]}%"></i></div></div>`).join("")}
        <div class="bar" style="margin:12px 0 0"><button class="btn primary" onclick="saveFeedback('${c.id}','Confirmado','${esc(c.top[0][0]).replace(/'/g, "\\'")}')">Confirmar motivo 1</button>
          <select id="other"><option value="">Corregir a…</option>${c.top.slice(1).map(t => `<option>${esc(t[0])}</option>`).join("")}<option>Otro motivo</option></select>
          <button class="btn" onclick="const v=document.getElementById('other').value;if(v)saveFeedback('${c.id}','Corregido',v)">Guardar corrección</button></div>
        <p class="small">${fb ? `<span class="tag ok">${fb.kind}</span> ${esc(fb.issue)}` : "Sin revisar."} El registro vive solo mientras esta página está abierta.</p></div>
    </div>
    <div class="grid">
      <div class="panel"><h2>Solución registrada</h2>${probable(c.t2_likely, c.t2, F.meta.t2_threshold)}</div>
      <div class="panel"><h2>Compensación monetaria</h2>${probable(c.t3_likely, c.t3, F.meta.t3_threshold)}</div>
    </div>
    <div class="grid">
      <div class="panel"><h2>Patrón semántico</h2><p style="margin:0 0 10px"><a href="#patron/${p.id}"><b>${patternName(p.id)}</b></a> · ${esc(p.product)}</p>
        <div class="chips">${p.terms.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <p class="small" style="margin-top:10px">Fiabilidad de la asignación en este patrón: ${reliability(p)}.</p></div>
      <div class="panel"><h2>¿Es un relato poco habitual?</h2>
        <span class="tag ${c.novel ? "arriba" : "ok"}">${c.novel ? "Novedoso" : "Habitual"}</span>
        <p class="small" style="margin-top:10px">${c.novel ? "Queda lejos de todos los patrones conocidos; conviene leerlo con atención." : "Se parece a los reclamos que suelen recibirse en su patrón."}</p></div>
    </div>
    <div class="panel"><h2>Reclamos históricos parecidos</h2>
      <p style="margin:0 0 8px">${c.neighbors.map(link).join(" · ")}</p>
      <p class="small">Similitud con el más parecido: ${pct(c.similarity)}. El desenlace de cada uno se consulta en su registro público.</p>
      <details><summary>Comprobación con el motivo que quedó registrado</summary>
        Motivo registrado: <b>${esc(c.issue)}</b>. ${rank === 0 ? "Coincide con el motivo 1." : rank > 0 ? `Está entre los tres sugeridos (motivo ${rank + 1}).` : "No está entre los tres sugeridos."}
        Esta comprobación solo es posible en la demostración: en operación el motivo aún no existe cuando se hace el triaje.</details>
      <details><summary>Cómo se obtuvo el resultado</summary>
        El texto se convierte en un vector; un modelo tabular en contexto (${esc(F.meta.t1_model)}) ordena los motivos; dos clasificadores lineales calibrados estiman solución y compensación;
        un índice de vecinos busca los reclamos parecidos, y la distancia a los 40 centros da el patrón y la novedad. Nada se reentrena al puntuar.</details></div>`;
}

function patrones() {
  const weekly = view.scale === "week";
  const periods = weekly ? F.weeks : F.days, table = weekly ? F.weekly : F.daily;
  if (!periods.includes(view.period)) view.period = periods[periods.length - 1];
  const k = periods.indexOf(view.period);
  let rows = F.patterns.map(p => ({p, row: table[p.id][k]})).map(x => ({...x, diff: x.row[1] ? x.row[0] / x.row[1] - 1 : 0, st: status(x.row, weekly)}));
  const total = rows.reduce((s, x) => s + x.row[0], 0);
  const count = code => rows.filter(x => x.st[0] === code).length;
  if (view.rising) rows = rows.filter(x => x.st[0] === "alerta" || x.st[0] === "arriba");
  rows.sort((a, b) => b.diff - a.diff);
  const mix = weekly ? F.mixture.find(m => m.week === view.period) : null;
  app.innerHTML = `<button class="back" onclick="location.hash='#menu'">← Menú principal</button>
    <h1>Observatorio de patrones</h1>
    <p class="lead">Cada patrón se compara con su propia expectativa. La alerta de crecimiento es semanal y acumula evidencia de varias semanas; por día solo hay expectativa e intervalo.</p>
    <div class="bar">
      <button class="btn ${weekly ? "on" : ""}" onclick="view.scale='week';view.period=null;patrones()">Por semana</button>
      <button class="btn ${weekly ? "" : "on"}" onclick="view.scale='day';view.period=null;patrones()">Por día</button>
      <label>${weekly ? "Semana del" : "Día"} <select onchange="view.period=this.value;patrones()">${periods.map(d => `<option value="${d}" ${d === view.period ? "selected" : ""}>${date(d)}</option>`).join("")}</select></label>
      <label><input type="checkbox" ${view.rising ? "checked" : ""} onchange="view.rising=this.checked;patrones()"> Solo los que suben</label></div>
    <div class="kpis">
      <div class="panel kpi"><span>Reclamos observados</span><b>${num(total)}</b><small>${weekly ? "en la semana" : "en el día"}</small></div>
      <div class="panel kpi"><span>Alertas de crecimiento</span><b>${weekly ? count("alerta") : "—"}</b><small>${weekly ? "regla acumulada semanal" : "no hay alerta diaria formal"}</small></div>
      <div class="panel kpi"><span>Por encima del intervalo</span><b>${count("arriba")}</b><small>sin alerta sostenida</small></div>
      <div class="panel kpi"><span>Mezcla de patrones</span><b>${mix ? (mix.rare ? "Rara" : "Normal") : "—"}</b><small>${mix ? "p-valor " + mix.p_value.toFixed(2) : "se evalúa por semana"}</small></div>
    </div>
    <div class="panel"><h2>Patrones observados frente a lo esperado</h2><div class="scroll"><table>
      <thead><tr><th>Patrón</th><th>Términos</th><th class="n">Observados</th><th class="n">Esperados</th><th class="n">Intervalo 80 %</th><th class="n">Diferencia</th><th>Estado</th></tr></thead><tbody>
      ${rows.map(({p, row, diff, st}) => `<tr class="click ${st[0] === "alerta" || st[0] === "arriba" ? st[0] : ""}" onclick="location.hash='#patron/${p.id}'">
        <td><b>${patternName(p.id)}</b></td><td>${esc(terms(p))}</td><td class="n">${num(row[0])}</td><td class="n">${num(row[1])}</td>
        <td class="n">${num(row[2])} – ${num(row[3])}</td><td class="n">${diff >= 0 ? "+" : ""}${pct(diff)}</td><td><span class="tag ${st[0]}">${st[1]}</span></td></tr>`).join("") || '<tr><td colspan="7">Ningún patrón sube en este periodo.</td></tr>'}
      </tbody></table></div></div>
    <p class="foot">Señales de reentrenamiento del periodo: novedosos ${pct(F.meta.novel_fraction, 1)} (aviso desde 3 %), cobertura del intervalo de 80 % ${pct(F.meta.coverage_80)} (aviso bajo 70 %),
      Macro-F1 del motivo ${F.meta.macro_f1.toFixed(3)}. ${F.meta.retrain ? "Se recomienda reentrenar." : "No se recomienda reentrenar."}</p>`;
}

function chart(p) {
  const rows = F.daily[p.id], W = 760, H = 240, L = 46, R = 12, T = 12, B = 30;
  const max = Math.max(...rows.map(r => Math.max(r[0], r[3]))) * 1.08 || 1;
  const x = k => L + k * (W - L - R) / (rows.length - 1), y = v => T + (1 - v / max) * (H - T - B);
  const path = col => rows.map((r, k) => `${k ? "L" : "M"}${x(k).toFixed(1)},${y(r[col]).toFixed(1)}`).join("");
  const band = rows.map((r, k) => `${x(k).toFixed(1)},${y(r[3]).toFixed(1)}`).concat(rows.map((r, k) => `${x(k).toFixed(1)},${y(r[2]).toFixed(1)}`).reverse()).join(" ");
  const ticks = [0, 0.5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#e3ebf3"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end" font-size="11" fill="#65778b">${num(max * f)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Reclamos diarios observados, esperados e intervalo de 80 por ciento">
    ${ticks}<polygon points="${band}" fill="#1769aa" opacity=".13"/>
    <path d="${path(1)}" fill="none" stroke="#1769aa" stroke-width="1.6" stroke-dasharray="5 4"/>
    <path d="${path(0)}" fill="none" stroke="#14263d" stroke-width="2"/>
    ${rows.map((r, k) => `<circle cx="${x(k)}" cy="${y(r[0])}" r="3.2" fill="${r[0] > r[3] ? "#b45309" : "#14263d"}"><title>${date(F.days[k])}: ${num(r[0])} observados, ${num(r[1])} esperados, intervalo ${num(r[2])} a ${num(r[3])}</title></circle>`).join("")}
    ${F.days.map((d, k) => `<text x="${x(k)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#65778b">${short(d)}</text>`).join("")}</svg>
    <p class="small">Línea continua: observados. Línea punteada: esperados. Banda: intervalo de 80 %. Los puntos naranjas quedan por encima del intervalo.</p>`;
}

function patron(id) {
  const p = PATTERN[id];
  if (!p) { location.hash = "#patrones"; return; }
  const weeks = F.weeks.map((w, k) => ({w, row: F.weekly[p.id][k], st: status(F.weekly[p.id][k], true)}));
  app.innerHTML = `<button class="back" onclick="location.hash='#patrones'">← Observatorio de patrones</button>
    <h1>${patternName(p.id)}</h1>
    <p class="lead">${esc(p.product)} en ${pct(p.product_share)} de sus reclamos · ${num(p.fit_rows)} reclamos en el periodo de ajuste.</p>
    <div class="grid">
      <div class="panel"><h2>Qué contiene</h2><div class="chips">${p.terms.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
        <blockquote class="quote">${esc(p.example.text)}<br><span class="small">Reclamo de ejemplo ${link(p.example.id)}, del catálogo de patrones.</span></blockquote>
        <p class="small" style="margin-top:10px">Fiabilidad de la asignación: ${reliability(p)}. Masa de frontera ${pct(p.frontier)}.</p></div>
    </div>
    <div class="grid">
      <div class="panel"><h2>Semanas del periodo</h2><div class="scroll"><table><thead><tr><th>Semana del</th><th class="n">Obs.</th><th class="n">Esp.</th><th class="n">Intervalo 80 %</th><th class="n">Acumulado</th><th>Estado</th><th></th></tr></thead><tbody>
        ${weeks.map(({w, row, st}) => `<tr><td>${date(w)}</td><td class="n">${num(row[0])}</td><td class="n">${num(row[1])}</td><td class="n">${num(row[2])} – ${num(row[3])}</td><td class="n">${row[5].toFixed(2)}</td>
          <td><span class="tag ${st[0]}">${st[1]}</span></td><td>${alerts[alertKey(w, p.id)] ? '<a href="#alertas">En seguimiento</a>' : `<button class="btn" onclick="register('${w}',${p.id})">Registrar alerta</button>`}</td></tr>`).join("")}
        </tbody></table></div>
        <p class="small" style="margin-top:10px">«Acumulado» es la suma de los excesos semanales que usa la regla de alerta; el umbral se fijó para una falsa alarma al mes.</p></div>
    </div>
    <div class="panel"><h2>Día a día</h2>${chart(p)}</div>`;
}

function register(week, id, origin = "Registrada a mano") {
  alerts[alertKey(week, id)] = {week, id, origin, step: 1, outcome: ""};
  if (origin === "Registrada a mano") location.hash = "#alertas";
}
function advance(key) { const a = alerts[key]; if (a.step < 3) a.step += 1; alertas(); }
function closeAlert(key, outcome) { if (outcome) { alerts[key].step = 4; alerts[key].outcome = outcome; alertas(); } }

function alertas() {
  const list = Object.entries(alerts).sort((a, b) => a[1].step - b[1].step);
  app.innerHTML = `<button class="back" onclick="location.hash='#menu'">← Menú principal</button>
    <h1>Seguimiento de alertas</h1>
    <p class="lead">Cada alerta de crecimiento se revisa y se cierra con una lectura. Ese registro es lo que después permite medir la precisión de las alertas.</p>
    ${list.map(([key, a]) => { const p = PATTERN[a.id], row = F.weekly[a.id][F.weeks.indexOf(a.week)];
      return `<div class="panel" style="margin-bottom:14px"><h2><a href="#patron/${a.id}">${patternName(a.id)}</a> · semana del ${date(a.week)}</h2>
        <p class="small">${esc(terms(p))} · ${num(row[0])} observados frente a ${num(row[1])} esperados · ${esc(a.origin)}</p>
        <div class="steps">${STEPS.map((s, k) => `<div class="step ${k + 1 < a.step || a.step === 4 ? "done" : k + 1 === a.step ? "now" : ""}">${k + 1}. ${s}</div>`).join("")}</div>
        ${a.step === 4 ? `<span class="tag ok">Cerrada</span> Lectura: <b>${esc(a.outcome)}</b>`
          : a.step === 3 ? `<div class="bar" style="margin:0"><label>Cerrar como <select onchange="closeAlert('${key}',this.value)"><option value="">Elegir lectura…</option>${OUTCOMES.map(o => `<option>${o}</option>`).join("")}</select></label></div>`
          : `<button class="btn primary" onclick="advance('${key}')">Avanzar al paso ${a.step + 1}</button>`}</div>`; }).join("") || '<div class="panel">No hay alertas en seguimiento.</div>'}
    <p class="foot">El seguimiento vive solo mientras esta página está abierta; guardarlo es trabajo de la siguiente fase.</p>`;
}

function route() {
  const [name, arg] = location.hash.replace("#", "").split("/");
  ({bandeja, reclamo: () => reclamo(arg), patrones, patron: () => patron(Number(arg)), alertas}[name] || menu)();
  window.scrollTo(0, 0);
}

if (!F.meta) {
  app.innerHTML = '<div class="panel">Esta página no tiene datos. Ejecuta <code>construir_foto.py --score &lt;carpeta&gt;</code> para incrustar una salida del pipeline.</div>';
} else {
  document.getElementById("notice").innerHTML = `<b>Foto fija de una salida real del pipeline.</b> ${num(F.meta.rows)} reclamos públicos de la CFPB recibidos entre el ${date(F.meta.first)} y el ${date(F.meta.last)}
    (periodo de calibración), puntuados sin reentrenar con el código del commit ${esc(F.meta.commit)}. No es un sistema en vivo: ninguna cifra se actualiza y lo que se marca aquí no se guarda.`;
  // Las alarmas que la regla acumulada dio en el periodo entran al seguimiento desde el inicio.
  F.weeks.forEach((w, k) => F.patterns.forEach(p => { if (F.weekly[p.id][k][6]) register(w, p.id, "Regla acumulada semanal"); }));
  window.addEventListener("hashchange", route);
  route();
}
</script>
</body>
</html>
