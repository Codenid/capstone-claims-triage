stages:
  type_data:
    cmd: uv run python src/data/type_data.py
    deps:
      - data/raw/cfpb_reclamos_narrativa.parquet
      - src/data/type_data.py
    outs:
      - data/interim/typed.parquet

  normalize_text:
    cmd: uv run python src/data/normalize_text.py
    deps:
      - data/interim/typed.parquet
      - src/data/normalize_text.py
    outs:
      - data/interim/normalized.parquet

  apply_taxonomy:
    cmd: uv run python src/data/apply_taxonomy.py
    deps:
      - data/interim/normalized.parquet
      - configs/product_taxonomy_v1.csv
      - configs/issue_taxonomy_v1.csv
      - configs/valid_product_issue_pairs_v1.csv
      - src/data/apply_taxonomy.py
    outs:
      - data/interim/taxonomy.parquet
