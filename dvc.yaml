stages:
  type_data:
    desc: >-
      P1 · Validar el esquema y tipar las fechas ·
      decisión: docs/decisiones/0002-preparacion-y-particion.md
    cmd: uv run python src/data/type_data.py
    deps:
      - data/raw/cfpb_reclamos_narrativa.parquet
      - src/data/type_data.py
      - src/data/params.py
    params:
      - preparacion.type_data
    outs:
      - data/interim/typed.parquet

  normalize_text:
    desc: >-
      P2 · Normalizar la narrativa y calcular su SHA-256 ·
      decisión: docs/decisiones/0002-preparacion-y-particion.md
    cmd: uv run python src/data/normalize_text.py
    deps:
      - data/interim/typed.parquet
      - src/data/normalize_text.py
      - src/data/params.py
    params:
      - preparacion.normalize_text
    outs:
      - data/interim/normalized.parquet

  apply_taxonomy:
    desc: >-
      P3 · Aplicar la taxonomía propuesta congelada al 2025-06-30 ·
      decisión: docs/decisiones/0002-preparacion-y-particion.md
    cmd: uv run python src/data/apply_taxonomy.py
    deps:
      - data/interim/normalized.parquet
      - configs/product_taxonomy_v1.csv
      - configs/issue_taxonomy_v1.csv
      - configs/valid_product_issue_pairs_v1.csv
      - src/data/apply_taxonomy.py
      - src/data/params.py
    params:
      - preparacion.apply_taxonomy
    outs:
      - data/interim/taxonomy.parquet

  build_targets:
    desc: >-
      P4 · Objetivos T1–T4, periodos y elegibilidad anti-fuga ·
      decisión: docs/decisiones/0001-alcance-y-fugas.md y 0002
    cmd: uv run python src/data/build_targets.py
    deps:
      - data/interim/taxonomy.parquet
      - configs/holdout_review_status.json
      - src/data/build_targets.py
      - src/data/params.py
    params:
      - preparacion.build_targets
    outs:
      - data/interim/targets_periods.parquet

  finalize_prepared:
    desc: >-
      P5 · Validar el contrato y publicar la tabla sin transformarla ·
      decisión: docs/decisiones/0002-preparacion-y-particion.md
    cmd: uv run python src/data/finalize_prepared.py
    deps:
      - data/interim/targets_periods.parquet
      - src/data/finalize_prepared.py
      - src/data/params.py
    params:
      - preparacion.finalize_prepared
    outs:
      - data/processed/prepared.parquet

  document_prepared:
    desc: >-
      P6 · Diccionario de datos e informe de limpieza generados desde la tabla ·
      decisión: docs/decisiones/0004-documentacion-de-la-tabla.md
    # --no-sync: the SLURM nodes have no internet to resolve the build.
    cmd: uv run --no-sync python src/data/document_prepared.py
    deps:
      - data/processed/prepared.parquet
      - docs/diccionario/descripciones.yaml
      - src/data/document_prepared.py
    params:
      - documentar
    outs:
      - docs/diccionario/diccionario.csv:
          cache: false
    metrics:
      - reports/preparation/informe_limpieza.json:
          cache: false
