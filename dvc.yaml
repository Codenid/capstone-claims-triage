stages:
  type_full_corpus:
    cmd: uv run python -m src.data.typing
    deps:
      - configs/dtypes.yaml
      - data/raw/cfpb_reclamos_narrativa.parquet
      - src/data/agregados.py
      - src/data/typing.py
      - src/paths.py
    params:
      - typing
    outs:
      - data/interim/tipado.parquet
      - reports/artefactos/f02_tipado_audit.csv

  prepare_eda_sample:
    cmd: uv run python -m src.data.prepare_eda
    deps:
      - data/raw/cfpb_reclamos_narrativa.parquet
      - src/data/agregados.py
      - src/data/load_raw.py
      - src/data/prepare_eda.py
      - src/paths.py
    params:
      - random_seed
      - splits
      - sample
      - text.hash_algorithm
      - text.normalization_version
    outs:
      - data/interim/eda_sample.parquet
      - data/interim/eda_hash_groups.parquet
      - reports/artefactos/eda_sample_hash_audit.csv

  build_tfidf:
    cmd: uv run python -m src.features.text
    deps:
      - data/interim/eda_sample.parquet
      - src/data/prepare_eda.py
      - src/features/text.py
      - src/paths.py
    params:
      - tfidf
    outs:
      - data/processed/r0_tfidf.npz
      - data/processed/r0_index.parquet
      - data/processed/r0_vectorizers.joblib
      - data/processed/r0_manifest.json

  e12_baseline:
    cmd: uv run python -m src.models.baseline
    deps:
      - data/processed/r0_tfidf.npz
      - data/processed/r0_index.parquet
      - src/data/prepare_eda.py
      - src/models/baseline.py
      - src/paths.py
    params:
      - random_seed
      - baseline
    outs:
      - data/processed/e12_predictions.parquet
      - reports/artefactos/e12_piso_senal.csv

  build_embeddings:
    cmd: uv run python -m src.features.embeddings
    deps:
      - data/interim/eda_sample.parquet
      - src/data/prepare_eda.py
      - src/features/embeddings.py
      - src/paths.py
    params:
      - embedding
      - text.normalization_version
    outs:
      - data/processed/r1_embeddings.npy
      - data/processed/r1_hash_index.parquet
      - data/processed/r1_manifest.json

  prepare_e14:
    cmd: uv run python -m src.features.e14_prepare
    deps:
      - data/interim/eda_sample.parquet
      - data/processed/r1_embeddings.npy
      - data/processed/r1_hash_index.parquet
      - src/data/prepare_eda.py
      - src/features/e14_prepare.py
      - src/paths.py
    params:
      - embedding
      - e14.company_mask
      - text.normalization_version
    outs:
      - data/processed/e14_train_index.parquet
      - data/processed/e14_masked_embeddings.npy
      - data/processed/e14_prepare_manifest.json
      - reports/artefactos/e14_company_ablation.csv

  e14_clustering:
    cmd: uv run python -m src.data.cluster_evidence
    deps:
      - data/interim/eda_sample.parquet
      - data/processed/e14_train_index.parquet
      - data/processed/e14_masked_embeddings.npy
      - data/processed/r1_embeddings.npy
      - data/processed/r1_hash_index.parquet
      - src/data/cluster_evidence.py
      - src/features/e14_prepare.py
      - src/features/text.py
      - src/paths.py
    params:
      - random_seed
      - tfidf
      - e14
      - clustering
      - embedding.max_seq_length
    outs:
      - data/processed/e14_assignments.parquet
      - data/processed/e14_projection.parquet
      - data/processed/e14_manifest.json
      - reports/artefactos/e14_clusters.csv
      - reports/artefactos/e14_stability.csv
      - reports/artefactos/e14_topics.csv
