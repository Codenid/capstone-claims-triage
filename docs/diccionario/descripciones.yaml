# Descripción de negocio de cada columna de data/processed/prepared.parquet.
# La escribe el equipo; document_prepared.py la copia al diccionario generado.
# Las 16 primeras son las columnas públicas de la Consumer Complaint Database
# de la CFPB; el resto las añade el pipeline de preparación.

"Date received": "Fecha en que la CFPB recibió el reclamo. Define el periodo temporal."
"Product": "Producto financiero declarado por la persona, en la taxonomía histórica de la CFPB."
"Sub-product": "Subproducto declarado, cuando existe."
"Issue": "Motivo del reclamo en la taxonomía histórica. Es la etiqueta de T1, no una entrada."
"Sub-issue": "Submotivo declarado, cuando existe. Posterior al evento, no se usa como entrada."
"Consumer complaint narrative": "Narrativa pública escrita por la persona, con marcas XXXX de anonimización. Entrada principal."
"Company public response": "Respuesta pública opcional de la empresa. Posterior al evento, excluida."
"Company": "Empresa a la que se dirige el reclamo. Candidata a entrada; no usada por los modelos vigentes."
"State": "Estado de EE. UU. de la persona. Candidata a entrada."
"ZIP code": "Código postal, a menudo truncado por la CFPB. Candidata a entrada."
"Tags": "Etiquetas de la CFPB (por ejemplo, Older American, Servicemember). Candidata a entrada."
"Submitted via": "Canal por el que llegó el reclamo (Web, Phone, …). Candidata a entrada."
"Date sent to company": "Fecha en que la CFPB envió el reclamo a la empresa. Posterior al evento."
"Company response to consumer": "Cierre registrado por la CFPB. De aquí salen T2 y T3; excluida como entrada."
"Timely response?": "Si la empresa respondió a tiempo según la CFPB. Define T4; excluida como entrada."
"Complaint ID": "Identificador único del reclamo en la CFPB. Único en toda la tabla."
"Consumer complaint narrative normalized": "Narrativa tras text_normalizer_v1 (Unicode NFKC, minúsculas, marcas XXXX unificadas, espacios). Entrada de TF-IDF y BGE."
"Consumer complaint narrative SHA-256": "Huella de la narrativa normalizada. Identifica textos repetidos para controlar la evaluación."
"Product canonical": "Producto en la taxonomía propuesta (21 originales → 18), congelada al 2025-06-30. Entrada categórica."
"Issue canonical": "Motivo en la taxonomía propuesta (173 originales → 140). Es T1."
"known_product": "Verdadero si el producto original existe en el mapa congelado."
"known_issue": "Verdadero si el motivo original existe en el mapa congelado."
"known_product_issue_pair": "Verdadero si el par producto–motivo está entre los 323 pares observados hasta el 2025-06-30."
"period": "Periodo temporal del reclamo: context_2015_2022, train_2023_2024, validation_2025_h1, holdout_2025_h2 u ood_2026_partial."
"T1": "Objetivo 1, motivo canónico del reclamo (90 clases en el entrenamiento). Métrica Macro-F1."
"T2": "Objetivo 2, verdadero si la CFPB registró compensación monetaria o no monetaria. Métrica average precision."
"T3": "Objetivo 3, verdadero si la CFPB registró compensación monetaria. Métrica average precision."
"T4": "Objetivo 4, verdadero si la empresa no respondió a tiempo según la CFPB. Descartado en §22."
"known_T1": "Verdadero si T1 está definido (motivo conocido)."
"known_T2": "Verdadero si el cierre registrado permite saber T2; las respuestas ambiguas quedan como desconocidas."
"known_T3": "Verdadero si el cierre registrado permite saber T3."
"known_T4": "Verdadero si Timely response? está informado."
"previously_reviewed_id": "Verdadero para los identificadores de 2025-H2 revisados antes del EDA y no recuperados."
"excluded_by_reviewed_text_group": "Verdadero si el reclamo comparte texto con un identificador revisado y por eso se excluye de la evaluación final."
"holdout_status": "Estado del reclamo frente a la evaluación final de 2025-H2 (bloqueada por los identificadores no recuperados)."
"no_shared_reference_text": "Verdadero si la narrativa no comparte texto con los periodos usados como referencia (contexto y entrenamiento)."
"eligible_T1_complete": "Verdadero si el reclamo puede evaluarse para T1 en la vista completa."
"eligible_T2_complete": "Verdadero si el reclamo puede evaluarse para T2 en la vista completa."
"eligible_T3_complete": "Verdadero si el reclamo puede evaluarse para T3 en la vista completa."
"eligible_T4_complete": "Verdadero si el reclamo puede evaluarse para T4 en la vista completa."
"eligible_T1_no_shared_text": "Verdadero si el reclamo puede evaluarse para T1 sin texto compartido con la referencia."
"eligible_T2_no_shared_text": "Verdadero si el reclamo puede evaluarse para T2 sin texto compartido con la referencia."
"eligible_T3_no_shared_text": "Verdadero si el reclamo puede evaluarse para T3 sin texto compartido con la referencia."
"eligible_T4_no_shared_text": "Verdadero si el reclamo puede evaluarse para T4 sin texto compartido con la referencia."
